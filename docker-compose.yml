services:
  # ==============================================================================
  # Database Service: PostgreSQL 16 with PostGIS 3.4
  # ==============================================================================
  db:
    image: postgis/postgis:16-3.4
    container_name: sih26191_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_password_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sih_disaster_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih_user} -d ${POSTGRES_DB:-sih_disaster_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sih_net

  # ==============================================================================
  # Backend Service: FastAPI + SQLAlchemy + GeoPandas / GIS Stack
  # ==============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sih26191_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      PROJECT_NAME: ${PROJECT_NAME:-"SIH 2026 - Disaster Risk & Relocation Assessment"}
      VERSION: ${VERSION:-1.0.0}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-INFO}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-sih_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_password_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sih_disaster_db}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sih_user}:${POSTGRES_PASSWORD:-sih_password_secure_2026}@db:5432/${POSTGRES_DB:-sih_disaster_db}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80","http://127.0.0.1:5173","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/backend/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sih_net

  # ==============================================================================
  # Frontend Service: React + Vite + Tailwind CSS + MapLibre GL NGINX Container
  # ==============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: sih26191_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sih_net

networks:
  sih_net:
    driver: bridge

volumes:
  sih_pgdata:
    driver: local
